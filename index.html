<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奶娃木鱼</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
    background: linear-gradient(170deg, #2b2118 0%, #3d2c1e 60%, #54381f 100%);
    min-height: 100vh; color: #f3e3c3; display: flex; flex-direction: column; align-items: center;
    padding: 26px 16px 48px; overflow-x: hidden;
  }
  h1 { font-size: 26px; letter-spacing: 6px; color: #ffd98a; font-weight: 700; text-shadow: 0 2px 12px rgba(255,180,60,.35); }
  .subtitle { font-size: 13px; color: #c9a877; margin-top: 6px; letter-spacing: 2px; }
  .merit-box { text-align: center; margin-top: 22px; }
  .merit-num { font-size: 54px; font-weight: 800; color: #ffe9b0; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .merit-label { font-size: 13px; color: #c9a877; letter-spacing: 4px; margin-top: 2px; }
  .title-row { margin-top: 12px; font-size: 15px; color: #ffd98a; }
  .title-row .next { color: #a9885c; font-size: 12px; margin-left: 8px; }
  .title-bar { width: 88vw; max-width: 340px; height: 7px; background: rgba(255,217,138,.15); border-radius: 4px; margin: 9px auto 0; overflow: hidden; }
  .title-fill { height: 100%; background: linear-gradient(90deg, #d9a441, #ffd98a); border-radius: 4px; transition: width .4s; }
  .today { margin-top: 10px; font-size: 13px; color: #a9885c; }

  .stage { position: relative; width: 88vw; max-width: 360px; height: 300px; margin-top: 8px; touch-action: manipulation; }
  .fish-wrap { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); cursor: pointer; transition: transform .07s; }
  .fish-wrap img { width: 258px; display: block; pointer-events: none; filter: drop-shadow(0 12px 22px rgba(0,0,0,.45)); -webkit-mask-image: linear-gradient(to bottom, #000 86%, transparent 99%); mask-image: linear-gradient(to bottom, #000 86%, transparent 99%); }
  .fish-wrap.hit { transform: translateX(-50%) scale(.955, .93); }
  .mallet {
    position: absolute; right: 6px; top: 6px; width: 130px; transform-origin: 88% 88%;
    transform: rotate(14deg); transition: transform .07s; pointer-events: none;
  }
  .mallet.hit { transform: rotate(-24deg); }
  .float-txt {
    position: absolute; font-size: 19px; font-weight: 700; color: #ffd98a; pointer-events: none;
    animation: rise 1s ease-out forwards; text-shadow: 0 1px 6px rgba(0,0,0,.4); white-space: nowrap;
  }
  @keyframes rise { 0% { opacity: 0; transform: translateY(6px) scale(.8); } 18% { opacity: 1; transform: translateY(0) scale(1.08); } 100% { opacity: 0; transform: translateY(-92px) scale(1); } }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  .btn {
    border: 1.5px solid rgba(255,217,138,.45); background: rgba(255,217,138,.08); color: #ffd98a;
    border-radius: 999px; padding: 10px 20px; font-size: 15px; cursor: pointer; transition: all .15s;
  }
  .btn:active { transform: scale(.95); background: rgba(255,217,138,.2); }
  .sign-card {
    display: none; margin-top: 20px; width: 92vw; max-width: 420px; background: linear-gradient(180deg, #fdf3d8, #f7e3b5);
    color: #6b4a1f; border-radius: 14px; padding: 20px 22px; text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,.35); animation: fadeIn .4s ease;
  }
  .sign-card.on { display: block; }
  .sign-card .sign-name { font-size: 19px; font-weight: 800; letter-spacing: 4px; color: #b07d2b; margin-bottom: 8px; }
  .sign-card .sign-text { font-size: 15px; line-height: 2; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .tip { margin-top: 22px; font-size: 12px; color: #8a6c44; text-align: center; line-height: 1.9; }

  /* 呼吸 overlay */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(20, 14, 8, .92); z-index: 50;
    flex-direction: column; align-items: center; justify-content: center;
  }
  .overlay.on { display: flex; }
  .breath-circle {
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle, #ffe9b0 0%, #d9a441 70%, rgba(217,164,65,.15) 100%);
    box-shadow: 0 0 60px rgba(255,217,138,.45); transition: transform 1s linear;
  }
  .breath-word { margin-top: 34px; font-size: 24px; letter-spacing: 8px; color: #ffd98a; }
  .breath-count { margin-top: 10px; font-size: 52px; font-weight: 800; color: #ffe9b0; line-height: 1.1; font-variant-numeric: tabular-nums; min-height: 58px; }
  .breath-sub { margin-top: 4px; font-size: 13px; color: #a9885c; }
  .close-btn { margin-top: 40px; border: 1.5px solid rgba(255,217,138,.5); background: transparent; color: #ffd98a; border-radius: 999px; padding: 10px 30px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
  <h1>奶娃木鱼</h1>
  <div class="subtitle">豪 华 版 · 敲 一 敲 · 静 静 心</div>

  <div class="merit-box">
    <div class="merit-num" id="meritNum">0</div>
    <div class="merit-label">功 德</div>
    <div class="title-row"><span id="titleName"></span><span class="next" id="titleNext"></span></div>
    <div class="title-bar"><div class="title-fill" id="titleFill" style="width:0%"></div></div>
    <div class="today" id="todayTxt"></div>
  </div>

  <div class="stage" id="stage">
    <svg class="mallet" id="mallet" viewBox="0 0 130 130">
      <line x1="112" y1="112" x2="52" y2="42" stroke="#a9743a" stroke-width="11" stroke-linecap="round"/>
      <circle cx="44" cy="34" r="21" fill="#c98d4b" stroke="#8a5a28" stroke-width="3"/>
      <circle cx="44" cy="34" r="12" fill="#e0aa5e"/>
    </svg>
    <div class="fish-wrap" id="fish">
      <img id="fishImg" alt="木鱼" src="cutout.webp">
    </div>
  </div>

  <div class="btn-row">
    <button class="btn" id="signBtn">🎋 抽今日签</button>
    <button class="btn" id="breathBtn">🫧 静心呼吸</button>
    <button class="btn" id="soundBtn">🔔 声音：开</button>
  </div>

  <div class="sign-card" id="signCard">
    <div class="sign-name" id="signName"></div>
    <div class="sign-text" id="signText"></div>
  </div>

  <div class="tip">点木鱼、敲空格，都能积功德<br>功德会自动存好，明天回来接着敲</div>

  <div class="overlay" id="breathOverlay">
    <div class="breath-circle" id="breathCircle"></div>
    <div class="breath-word" id="breathWord">准备</div>
    <div class="breath-count" id="breathCount"></div>
    <div class="breath-sub">跟着数字一起呼吸</div>
    <button class="close-btn" id="breathClose">结束 · 回到木鱼</button>
  </div>

<script async src="frames.js"></script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script>
const TITLES = [
  [0, "小沙弥"], [100, "清心居士"], [300, "修行僧"], [666, "禅定大师"],
  [1000, "得道高僧"], [3000, "一方活佛"], [6666, "功德圆满"], [10000, "功德无量"]
];
const SIGNS = [
  ["上上签", "宜躺平，宜干饭，宜睡个午觉；忌内耗，忌想太多。今天的好运，已经在路上了。"],
  ["上上签", "心烦的时候就敲敲木鱼。天大的事，也先放到明天再说。"],
  ["中上签", "宜给妈妈打个电话，宜夸室友一句。好运，往往就藏在这些小事里。"],
  ["上上签", "宜听一首老歌，宜出去晒晒太阳；忌 emo，忌深夜做决定。"],
  ["平安签", "不求大富大贵，只求今晚睡个好觉。睡好了，就是赚到了。"],
  ["上上签", "宜把烦恼说出口。你身边的人，其实都向着你呢。"],
  ["中上签", "宜慢慢来，忌跟人比进度。花有花期，你也有你的。"],
  ["上上签", "今日宜敲木鱼一百下：功德 +1，焦虑 −1。"],
  ["平安签", "吃饱，穿暖，早休息。身体舒服了，心就稳了。"],
  ["上上签", "宜相信自己一次。你比自己想象中，更能扛事。"]
];
const $ = id => document.getElementById(id);
const todayStr = () => new Date().toISOString().slice(0, 10);
const memStore = {};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return (k in memStore) ? memStore[k] : null; } }
function lsSet(k, v) { memStore[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
let total = parseInt(lsGet("muyu_total") || "0", 10);
let todayCount = lsGet("muyu_date") === todayStr()
  ? parseInt(lsGet("muyu_today") || "0", 10) : 0;
let soundOn = true, audioCtx = null;

function save() {
  lsSet("muyu_total", total);
  lsSet("muyu_today", todayCount);
  lsSet("muyu_date", todayStr());
}
function render() {
  $("meritNum").textContent = total;
  let cur = TITLES[0], nextT = null;
  for (let i = 0; i < TITLES.length; i++) {
    if (total >= TITLES[i][0]) cur = TITLES[i];
    if (total < TITLES[i][0] && !nextT) nextT = TITLES[i];
  }
  $("titleName").textContent = "🏅 " + cur[1];
  if (nextT) {
    $("titleNext").textContent = "距「" + nextT[1] + "」还差 " + (nextT[0] - total);
    const prevBase = cur[0];
    $("titleFill").style.width = Math.min(100, (total - prevBase) / (nextT[0] - prevBase) * 100) + "%";
  } else {
    $("titleNext").textContent = "已是最高称号";
    $("titleFill").style.width = "100%";
  }
  $("todayTxt").textContent = "今日已敲 " + todayCount + " 下";
}
const KNOCK_URI = "laugh.m4a";

let audioPool = [], poolIdx = 0;
function knockSoundInit() {
  try {
    for (let i = 0; i < 3; i++) { const a = new Audio(KNOCK_URI); a.preload = "auto"; a.load(); audioPool.push(a); }
  } catch (e) {}
}
function knockSound() {
  if (!soundOn) return;
  try {
    if (!audioPool.length) knockSoundInit();
    const a = audioPool[poolIdx++ % audioPool.length];
    a.currentTime = 0;
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
let laughRAF = null, laughIdx = 0, laughDir = 1, laughStop = null, normalSrc = null, lastFrameT = 0;
function laughStep(ts) {
  if (!laughRAF) return;
  if (!lastFrameT) lastFrameT = ts;
  if (ts - lastFrameT >= 50) {
    lastFrameT = ts;
    laughIdx += laughDir;
    if (laughIdx >= window.LAUGH_FRAMES.length - 1) { laughIdx = window.LAUGH_FRAMES.length - 1; laughDir = -1; }
    else if (laughIdx <= 0) { laughIdx = 0; laughDir = 1; }
    $("fishImg").src = window.LAUGH_FRAMES[laughIdx];
  }
  laughRAF = requestAnimationFrame(laughStep);
}
function startLaugh() {
  const img = $("fishImg");
  if (normalSrc === null) normalSrc = img.src;
  if (laughRAF) return;
  laughIdx = 0; laughDir = 1; lastFrameT = 0;
  img.src = window.LAUGH_FRAMES[0];
  laughRAF = requestAnimationFrame(laughStep);
}
function pokeLaugh() {
  if (!window.LAUGH_FRAMES || !window.LAUGH_FRAMES.length) return;
  startLaugh();
  clearTimeout(laughStop);
  laughStop = setTimeout(() => {
    if (laughRAF) cancelAnimationFrame(laughRAF);
    laughRAF = null;
    $("fishImg").src = normalSrc;
  }, 900);
}
function hit() {
  pokeLaugh();
  total++; todayCount++; save(); render(); knockSound();
  const fish = $("fish"), mallet = $("mallet");
  fish.classList.add("hit"); mallet.classList.add("hit");
  setTimeout(() => { fish.classList.remove("hit"); mallet.classList.remove("hit"); }, 85);
  const s = document.createElement("div");
  s.className = "float-txt";
  s.textContent = "功德 +1";
  s.style.left = (95 + Math.random() * 110) + "px";
  s.style.top = (30 + Math.random() * 30) + "px";
  $("stage").appendChild(s);
  setTimeout(() => s.remove(), 1000);
}
let lastHitAt = 0;
function hitEvent(e) {
  const now = Date.now();
  if (now - lastHitAt < 350) return;
  lastHitAt = now;
  hit();
}
$("stage").addEventListener("pointerdown", hitEvent);
$("stage").addEventListener("touchend", hitEvent);
$("stage").addEventListener("click", hitEvent);
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !$("breathOverlay").classList.contains("on")) { e.preventDefault(); hit(); }
});
$("soundBtn").onclick = () => {
  soundOn = !soundOn;
  $("soundBtn").textContent = soundOn ? "🔔 声音：开" : "🔕 声音：关";
};
$("signBtn").onclick = () => {
  const key = "muyu_sign_" + todayStr();
  let idx = lsGet(key);
  if (idx === null) {
    idx = Math.floor(Math.random() * SIGNS.length);
    lsSet(key, idx);
  }
  const s = SIGNS[parseInt(idx, 10)];
  $("signName").textContent = "🎋 今日签 · " + s[0];
  $("signText").textContent = s[1];
  $("signCard").classList.add("on");
};

/* 静心呼吸：吸气4秒 → 屏息2秒 → 呼气6秒，数字倒数 */
let breathTimer = null, breathRun = false;
const PHASES = [
  { word: "吸 气", dur: 4, scale: 1.45 },
  { word: "屏 息", dur: 2, scale: 1.45 },
  { word: "呼 气", dur: 6, scale: 1 }
];
function startPhase(i) {
  if (!breathRun) return;
  const p = PHASES[i], circle = $("breathCircle");
  $("breathWord").textContent = p.word;
  circle.style.transition = "transform " + p.dur + "s linear";
  circle.style.transform = "scale(" + p.scale + ")";
  let left = p.dur;
  $("breathCount").textContent = left;
  clearInterval(breathTimer);
  breathTimer = setInterval(() => {
    left--;
    if (left <= 0) { clearInterval(breathTimer); startPhase((i + 1) % PHASES.length); }
    else $("breathCount").textContent = left;
  }, 1000);
}
$("breathBtn").onclick = () => {
  $("breathOverlay").classList.add("on");
  breathRun = true; startPhase(0);
};
$("breathClose").onclick = () => {
  breathRun = false;
  clearInterval(breathTimer);
  $("breathCircle").style.transform = "scale(1)";
  $("breathOverlay").classList.remove("on");
};
knockSoundInit();
let fpT = setInterval(() => { if (window.LAUGH_FRAMES) { clearInterval(fpT); window.LAUGH_FRAMES.forEach(u => { const i = new Image(); i.src = u; }); } }, 400);
render();
</script>
</body>
</html>
